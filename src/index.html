<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖片壓縮工具</title>
</head>
<body>
    <div id="app">
        <h1>圖片壓縮工具</h1>

        <!-- 上傳區域 -->
        <div id="upload-section">
            <input type="file" id="file-input" accept="image/*" multiple>
            <div id="drop-zone">拖放圖片到這裡，或點擊選擇檔案</div>
        </div>

        <!-- 設定區域 -->
        <div id="settings-section">
            <div>
                <label>輸出格式：</label>
                <select id="format-select">
                    <option value="jpeg">JPEG</option>
                    <option value="png">PNG</option>
                    <option value="webp">WEBP</option>
                </select>
            </div>
            <div>
                <label>品質：</label>
                <select id="quality-select">
                    <option value="30">低 (30%)</option>
                    <option value="60" selected>中 (60%)</option>
                    <option value="90">高 (90%)</option>
                </select>
            </div>
            <div>
                <label>縮放比例：</label>
                <select id="scale-select">
                    <option value="1">原尺寸</option>
                    <option value="0.75">75%</option>
                    <option value="0.5">50%</option>
                    <option value="0.25">25%</option>
                </select>
            </div>
        </div>

        <!-- 圖片列表 -->
        <div id="image-list"></div>

        <!-- 批次操作 -->
        <div id="batch-actions" style="display:none;">
            <button id="compress-all-btn">壓縮全部</button>
            <button id="download-all-btn">下載全部 (ZIP)</button>
            <button id="clear-all-btn">清除全部</button>
        </div>

        <!-- 狀態訊息 -->
        <div id="status"></div>
    </div>
</body>
</html>
